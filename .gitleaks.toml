title = "idena-go gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Public Idena IPFS swarm key constants"
regexTarget = "match"
regexes = [
  '''(?i)swarmKey\s*[:=]\s*"[0-9a-f]{64}"''',
]

[[allowlists]]
description = "Deterministic VRF test vector private key"
regexTarget = "match"
regexes = [
  '''privKey\s*=\s*`[0-9a-f]{64}`''',
]

[[allowlists]]
description = "Fixed blocks-with-address API test key"
regexTarget = "match"
regexes = [
  '''blocksWithAddressTestKey\s*=\s*"[0-9a-f]{64}"''',
]
